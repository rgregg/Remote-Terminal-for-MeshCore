name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch, tag or sha). Defaults to this ref.'
        required: false
        type: string
  # Callable so sync-upstream.yml can publish a tag it just created. Tags
  # pushed with GITHUB_TOKEN do not start a new workflow run, so an automated
  # release has to invoke the build directly rather than rely on the push
  # trigger above.
  workflow_call:
    inputs:
      ref:
        description: 'Ref to build (branch, tag or sha).'
        required: true
        type: string

concurrency:
  group: publish-image-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve image name and version
        id: meta
        env:
          # The ref being built. On a push this is the pushed ref; when called
          # or dispatched it is the requested one.
          BUILD_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          # GHCR requires a lowercase image path; github.repository is mixed case.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          # pyproject.toml is the single source of truth for the version, the
          # same value scripts/build/publish.sh releases under.
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          [ -n "$version" ] || { echo "Could not read version from pyproject.toml" >&2; exit 1; }

          # Constrain to X.Y.Z before it reaches any shell command. Matches
          # release_validate_version() in scripts/build/release_common.sh.
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version '$version' is not in X.Y.Z format" >&2; exit 1; }

          git_hash="$(git rev-parse --short HEAD)"

          # A ref named exactly X.Y.Z is a release build; anything else (main,
          # a sha, a topic branch) is not. Deriving this from the ref name
          # rather than github.ref_type keeps push, dispatch and call
          # identical.
          #
          # Releases own :latest and the floating aliases:
          #
          #   :3       -> newest 3.y.z      (tracks minor + patch releases)
          #   :3.17    -> newest 3.17.z     (tracks patch releases only)
          #   :3.17.1  -> immutable, never moves
          #   :<sha>   -> immutable, never moves
          #
          # Non-release builds publish only :main and the sha, so an unreleased
          # commit can never move :latest or overwrite a released :X.Y.Z.
          if [[ $BUILD_REF =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # The tag must agree with pyproject.toml, otherwise :X.Y.Z would
            # not contain the code that tag names.
            if [ "$BUILD_REF" != "$version" ]; then
              echo "Ref $BUILD_REF does not match pyproject.toml version $version" >&2
              exit 1
            fi
            major="${version%%.*}"      # 3.17.1 -> 3
            minor="${version%.*}"       # 3.17.1 -> 3.17
            tags="latest $major $minor $version $git_hash"
          else
            tags="main $git_hash"
          fi

          {
            echo "image=$image"
            echo "version=$version"
            echo "git_hash=$git_hash"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuse the repo's own publish script rather than a parallel buildx
      # invocation, so CI and `scripts/build/publish.sh` cannot drift. Passing
      # --tag also carries COMMIT_HASH into the build (the Dockerfile surfaces
      # it as ENV COMMIT_HASH and VITE_COMMIT_HASH, so the UI reports the build
      # it came from).
      - name: Build and push multi-arch image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          GIT_HASH: ${{ steps.meta.outputs.git_hash }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=(
            --version "$VERSION"
            --git-hash "$GIT_HASH"
            --image "$IMAGE"
            --platforms linux/amd64,linux/arm64
          )
          for tag in $TAGS; do
            args+=(--tag "$tag")
          done
          scripts/build/push_docker_multiarch.sh "${args[@]}"

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "### Published from \`$BUILD_REF\`"
            echo
            echo '```'
            for tag in $TAGS; do echo "$IMAGE:$tag"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
