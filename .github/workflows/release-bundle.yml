name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name and version
        id: meta
        run: |
          set -euo pipefail
          # GHCR requires a lowercase image path; github.repository is mixed case.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          # pyproject.toml is the single source of truth for the version, the
          # same value scripts/build/publish.sh releases under.
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          [ -n "$version" ] || { echo "Could not read version from pyproject.toml" >&2; exit 1; }

          # Constrain to X.Y.Z before it reaches any shell command. Matches
          # release_validate_version() in scripts/build/release_common.sh.
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version '$version' is not in X.Y.Z format" >&2; exit 1; }

          # On a tag push, the tag must agree with pyproject.toml, otherwise the
          # :X.Y.Z image would not contain the code that tag points at.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version $version" >&2
            exit 1
          fi

          {
            echo "image=$image"
            echo "version=$version"
            echo "git_hash=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuse the repo's own publish script rather than a parallel buildx
      # invocation, so CI and `scripts/build/publish.sh` cannot drift. It tags
      # :latest, :X.Y.Z and :<short-sha>, and passes COMMIT_HASH through to the
      # build (the Dockerfile surfaces it as ENV COMMIT_HASH and
      # VITE_COMMIT_HASH, so the UI reports the build it came from).
      - name: Build and push multi-arch image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          GIT_HASH: ${{ steps.meta.outputs.git_hash }}
        run: |
          scripts/build/push_docker_multiarch.sh \
            --version "$VERSION" \
            --git-hash "$GIT_HASH" \
            --image "$IMAGE" \
            --platforms linux/amd64,linux/arm64

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          GIT_HASH: ${{ steps.meta.outputs.git_hash }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$IMAGE:latest"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$GIT_HASH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
